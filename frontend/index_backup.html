<!DOCTYPE html>
<html>

<head>
<title>AI Chat</title>

<style>
body {
    font-family: Arial;
    display: flex;
    height: 100vh;
    margin: 0;
}

#threads {
    width: 250px;
    background: #f0f0f0;
    padding: 10px;
}

#chat {
    flex: 1;
    padding: 20px;
}

#messages {
    height: 400px;
    border: 1px solid gray;
    overflow-y: auto;
    padding: 10px;
}

.thread {
    padding: 5px;
    cursor: pointer;
}

.active {
    background: #ccc;
    font-weight: bold;
}
</style>

</head>

<body>

<!-- THREADS -->
<div id="threads">
    <h3>Threads</h3>
    <div id="threadList"></div>
    <button onclick="createThread()">New Thread</button>
</div>

<!-- CHAT -->
<div id="chat">
    <h2>Chat</h2>

    <div id="messages"></div>

    <br>

    <input id="messageInput" placeholder="Type message">
    <button onclick="sendMessage()">Send</button>
</div>

<script>

let threads = {}
let currentThread = null

// CREATE THREAD
function createThread() {
    let id = "thread" + Object.keys(threads).length
    threads[id] = []
    currentThread = id
    renderThreads()
    renderMessages()
}

// RENDER THREAD LIST
function renderThreads() {
    let html = ""

    for (let t in threads) {
        let activeClass = t === currentThread ? "active" : ""
        html += `<div class="thread ${activeClass}" onclick="selectThread('${t}')">${t}</div>`
    }

    document.getElementById("threadList").innerHTML = html
}

// SELECT THREAD
function selectThread(t) {
    currentThread = t
    renderThreads()
    renderMessages()
}

// RENDER MESSAGES
function renderMessages() {
    let msgs = threads[currentThread] || []
    let html = ""

    msgs.forEach(m => {
        html += `<p><b>You:</b> ${m.user}</p>`
        html += `<p><b>AI:</b> ${m.ai}</p>`
    })

    document.getElementById("messages").innerHTML = html

    // auto scroll
    let msgBox = document.getElementById("messages")
    msgBox.scrollTop = msgBox.scrollHeight
}

// SEND MESSAGE (FINAL FIXED VERSION)
async function sendMessage() {

    let input = document.getElementById("messageInput")
    let msg = input.value.trim()

    if (!msg || !currentThread) return

    try {
        let res = await fetch("http://127.0.0.1:8000/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                user_id: currentThread,
                message: msg
            })
        })

        // check server response
        if (!res.ok) {
            throw new Error("Server error: " + res.status)
        }

        let data = await res.json()

        console.log("DEBUG RESPONSE:", data) // 👈 for debugging

        // SAFE handling (no undefined issue)
        let aiReply = data?.response || data || "No response from AI"

        threads[currentThread].push({
            user: msg,
            ai: aiReply
        })

        renderMessages()
        input.value = ""

    } catch (err) {
        console.error("ERROR:", err)

        threads[currentThread].push({
            user: msg,
            ai: "⚠️ Error connecting to backend"
        })

        renderMessages()
    }
}

// INIT FIRST THREAD
createThread()

</script>

</body>
</html>
